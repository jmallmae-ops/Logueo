server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nota: no definir un bloque "types" aquí; reemplazaría todos los tipos MIME
    # de nginx y los .js se servirían mal (página en blanco).
    # .wasm ya está en mime.types y .onnx usa application/octet-stream por defecto.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html siempre fresco para que cada deploy se vea al instante
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /RQD_Analyzer_Web_Ready/index.html { add_header Cache-Control "no-cache"; }

    # Assets con hash y modelos: caché larga
    location ~* \.(js|css|onnx|wasm|png|jpg|svg)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
